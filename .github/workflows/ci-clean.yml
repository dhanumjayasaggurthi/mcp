name: smarthub-mcp-agentic-gateway-ci

on:
  push:
    branches: [enterprise-data-platform-clean]
    paths-ignore:
      - ".github/workflows/materialize-clean-source.yml"
  pull_request:
    branches: [main, enterprise-data-platform-clean]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: edp_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: edp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EDP_TEST_POSTGRES_DSN: postgresql+psycopg://edp_test:isolated-ci-only@127.0.0.1:5432/edp_test
      EDP_TEST_NATIVE_DSN: postgresql+psycopg://edp_test:isolated-ci-only@127.0.0.1:5432/edp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and test platform
        shell: bash
        run: |
          set -euo pipefail
          cd enterprise_delivery/platform_v1
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          npm ci --prefix frontend
          export PATH="$PWD/frontend/node_modules/.bin:$PATH"
          PYTHONPATH=. pytest -q tests
          python -m compileall -q enterprise_data_platform
          cd ..
          PYTHONPATH=. pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Control Hub
        shell: bash
        run: |
          set -euo pipefail
          cd enterprise_delivery/platform_v1/frontend
          npm ci
          npm run build
          npm run check


  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render base, canary and native PostgreSQL manifests
        run: |
          kubectl kustomize enterprise_delivery/platform_v1/deploy/kubernetes/base > /tmp/edp-base.yaml
          kubectl kustomize enterprise_delivery/platform_v1/deploy/kubernetes/canary > /tmp/edp-canary.yaml
          kubectl kustomize enterprise_delivery/platform_v1/deploy/kubernetes/postgres-native > /tmp/edp-native.yaml
          kubectl kustomize enterprise_delivery/platform_v1/deploy/kubernetes/console > /tmp/smarthub-console.yaml
      - name: Build and check console container
        run: |
          docker build -t smarthub-console-ci enterprise_delivery/platform_v1/frontend
          docker run -d --name console-ci --read-only --tmpfs /tmp:uid=101,gid=101 --tmpfs /etc/nginx/conf.d:uid=101,gid=101 -e API_UPSTREAM=http://127.0.0.1:8081 -p 127.0.0.1:8088:8080 smarthub-console-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/console-health; then
              curl -fsS http://127.0.0.1:8088/ | grep -q 'SmartHub MCP'
              exit 0
            fi
            sleep 1
          done
          docker logs console-ci
          exit 1
      - name: Build production image
        run: docker build -t edp-ci enterprise_delivery/platform_v1
      - name: Verify fail-closed startup
        run: |
          if docker run --rm edp-ci; then
            echo "Production must reject missing configuration"
            exit 1
          fi

  sql-connectors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.4
            dialect: mysql
          - image: mariadb:11.4
            dialect: mariadb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start isolated SQL service
        env:
          DATABASE_IMAGE: ${{ matrix.image }}
        run: |
          docker run -d --name edp-sql -p 127.0.0.1:3306:3306 -e MYSQL_ROOT_PASSWORD=isolated-ci-only -e MYSQL_DATABASE=edp_test "$DATABASE_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec edp-sql sh -c 'if command -v mariadb-admin >/dev/null; then mariadb-admin ping -h 127.0.0.1 -uroot -pisolated-ci-only; else mysqladmin ping -h 127.0.0.1 -uroot -pisolated-ci-only; fi' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs edp-sql
          exit 1
      - name: Verify dialect contracts
        working-directory: enterprise_delivery/platform_v1
        env:
          EDP_TEST_SQL_DSN: ${{ matrix.dialect }}+pymysql://root:isolated-ci-only@127.0.0.1:3306/edp_test
        run: |
          pip install --require-hashes -r requirements.lock
          PYTHONPATH=. pytest -q tests/test_connector_integration.py

  search-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start isolated OpenSearch
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker run -d --name edp-search -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true -e 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m' opensearchproject/opensearch:3.2.0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs edp-search
          exit 1
      - name: Verify keyword/vector and ingestion contracts
        working-directory: enterprise_delivery/platform_v1
        env:
          EDP_TEST_SEARCH_URL: http://127.0.0.1:9200
        run: |
          pip install --require-hashes -r requirements.lock
          PYTHONPATH=. pytest -q tests/test_connector_integration.py


  console-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install console and isolated API dependencies
        working-directory: enterprise_delivery/platform_v1
        run: |
          pip install --require-hashes -r requirements.lock
          npm ci --prefix frontend
          cd frontend
          npm install --no-save --package-lock=false @playwright/test@1.55.1
          npx playwright install --with-deps chromium
          npm run build
      - name: Exercise console against real durable API
        working-directory: enterprise_delivery/platform_v1
        run: |
          PYTHONPATH=.:tests uvicorn ui_server:create_test_app --factory --host 127.0.0.1 --port 8080 --no-access-log > /tmp/smarthub-ui-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/livez >/dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npm run test:e2e || { cat /tmp/smarthub-ui-api.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smarthub-console-browser-evidence
          path: |
            enterprise_delivery/platform_v1/frontend/screenshots
            enterprise_delivery/platform_v1/frontend/playwright-report
            enterprise_delivery/platform_v1/frontend/test-results
