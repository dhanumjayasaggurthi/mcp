apiVersion: apps/v1
kind: Deployment
metadata:
  name: edp-api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: edp, role: api}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: edp, role: api, release: stable}
    spec:
      serviceAccountName: edp-runtime
      terminationGracePeriodSeconds: 50
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: edp, role: api}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app: edp, role: api}}
      containers:
        - name: api
          image: edp-runtime:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: edp-config}}]
          resources:
            requests: {cpu: "500m", memory: 512Mi, ephemeral-storage: 128Mi}
            limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets/edp, readOnly: true}
            - {name: temporary, mountPath: /tmp}
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 10, timeoutSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 3}
      volumes:
        - name: secrets
          secret: {secretName: edp-runtime-secrets, defaultMode: 0440}
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: edp-api
spec:
  selector: {app: edp, role: api, release: stable}
  ports: [{name: http, port: 80, targetPort: http}]
