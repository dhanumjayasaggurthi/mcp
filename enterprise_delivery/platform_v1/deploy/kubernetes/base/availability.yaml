apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: edp-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: edp-api}
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: edp-api}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: edp, role: api}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: edp-indexing}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: edp, role: indexing}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: edp-export}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: edp, role: export}}
