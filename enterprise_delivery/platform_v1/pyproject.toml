[project]
name = "enterprise-data-retrieval-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pytz>=2024.1"]
server = ["uvicorn>=0.30"]

[tool.setuptools]
packages = ["enterprise_data_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
