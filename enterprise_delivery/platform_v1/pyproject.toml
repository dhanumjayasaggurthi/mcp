[project]
name = "smarthub-mcp-agentic-gateway-core"
version = "0.1.0"
description = "SmartHub MCP & Agentic Gateway core services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "opentelemetry-api>=1.44,<2",
  "mcp==1.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pytz>=2024.1", "hypothesis>=6", "pyyaml>=6"]
server = ["uvicorn>=0.30"]
production = [
  "psycopg[binary]>=3.2,<4", "pyjwt[crypto]>=2.10,<3", "cryptography>=44",
  "pymysql>=1.1,<2",
  "httpx>=0.27,<1", "pyarrow>=20", "boto3>=1.35,<2", "sqlglot>=30,<31",
  "opentelemetry-api>=1.44,<2", "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]
mysql = ["pymysql>=1.1,<2"]
snowflake = ["snowflake-sqlalchemy>=1.7,<2"]

[tool.setuptools]
packages = ["enterprise_data_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires externally provisioned PostgreSQL or search services"]
