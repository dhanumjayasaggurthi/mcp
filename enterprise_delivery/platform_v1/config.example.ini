# Copy to config.ini. Keep that private file out of Git.
# Environment variables override matching INI settings. Restart after changes.
[app]
environment = dev
cursor_secret_ref = ini://secrets/cursor_key
# Relative paths resolve beside config.ini; absolute Linux/Windows paths also work.
secret_dir = secrets
resource_limits = {"max_seconds":30,"global_concurrency":200,"source_concurrency":20}

# Dedicated control database, not your RDH source database.
# TLS verify-full remains mandatory. Supply the CA certificate path as needed.
[database]
host = localhost
port = 5432
name = edp_control
user = edp_runtime
password =
sslrootcert =
pool_size = 10
# Alternatively: dsn_ref = file://control-dsn

[oidc]
issuer = https://YOUR-ISSUER
audience = enterprise-data-platform
jwks_url = https://YOUR-JWKS-ENDPOINT
# Entra: required_scope = access_as_user
# Entra: allowed_client_ids = YOUR-PORTAL-CLIENT-ID

[secrets]
cursor_key =
search_token =
embedding_token =
reranking_token =
# Source registrations can refer to ini://secrets/rdh_dsn, for example.
rdh_dsn =

[search]
endpoint =
token_ref = ini://secrets/search_token

# Optional generic embedding service. Leave endpoint empty when using Azure.
[embedding]
embedding_dim = 3072
embedding_batch_size = 16
endpoint =
token_ref = ini://secrets/embedding_token
profiles = {}

[reranking]
endpoint =
token_ref = ini://secrets/reranking_token

[export]
bucket =
kms_key_id =
retention_seconds = 86400

[processing]
queue_capacity = 10000

# Existing RDH source. Register as postgres with secret_ref=ini://postgres/dsn.
[POSTGRES]
host = YOUR-RDH-HOST
port = 5432
user = YOUR-READ-ONLY-USER
password =
database = regulatory
schema =
sslrootcert =

# Install the optional Snowflake dependencies before registering this source.
# Register as snowflake with secret_ref=ini://snowflake/dsn.
[SNOWFLAKE]
account = YOUR-ACCOUNT
user = YOUR-SERVICE-USER
private_key_path = keys/service-key.p8
private_key_password =
role = YOUR-READ-ONLY-ROLE
warehouse = YOUR-WAREHOUSE
database = YOUR-DATABASE
schema = YOUR-SCHEMA

# Explicit enablement; API version and deployment must match your gateway.
[AZURE_OPENAI_EMBEDDING]
enabled = false
api_base = https://YOUR-GATEWAY/openai-embeddings
api_version = 2022-12-01
deployment =
profile_id = rdh-embedding
api_key =
# api_key_ref = file://azure-embedding-key

# Add embedding_dim and embedding_batch_size to the existing [embedding] section.
# Do not create a second [EMBEDDING] section (names are case-insensitive).
# embedding_dim = 3072
# embedding_batch_size = 16

[authorization]
# For Entra delegated access, set admin_scope to the configured API scope name.
admin_scope = edp:admin
admin_group_ids = data-platform-admin
admin_app_roles =
