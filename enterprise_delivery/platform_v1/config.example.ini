# Copy to config.ini. Keep that private file out of Git.
# Environment variables override matching INI settings. Restart after changes.
[app]
environment = dev
cursor_secret_ref = ini://secrets/cursor_key
# Relative paths resolve beside config.ini; absolute Linux/Windows paths also work.
secret_dir = secrets
resource_limits = {"max_seconds":30,"global_concurrency":200,"source_concurrency":20}

# Dedicated control database, not your RDH source database.
# TLS verify-full remains mandatory. Supply the CA certificate path as needed.
[database]
host = localhost
port = 5432
name = edp_control
user = edp_runtime
password =
sslrootcert =
pool_size = 10
# Alternatively: dsn_ref = file://control-dsn

[oidc]
issuer = https://YOUR-ISSUER
audience = enterprise-data-platform
jwks_url = https://YOUR-JWKS-ENDPOINT

[secrets]
cursor_key =
search_token =
embedding_token =
reranking_token =
# Source registrations can refer to ini://secrets/rdh_dsn, for example.
rdh_dsn =

[search]
endpoint =
token_ref = ini://secrets/search_token

# Existing embedding-service protocol; not an Azure OpenAI adapter.
[embedding]
endpoint =
token_ref = ini://secrets/embedding_token
profiles = {}

[reranking]
endpoint =
token_ref = ini://secrets/reranking_token

[export]
bucket =
kms_key_id =
retention_seconds = 86400

[processing]
queue_capacity = 10000
